; AlphaVulkan settings. Copy next to AlphaVulkan.exe (or run from the source folder).

[Game]
; Folder holding the owner's Cube World Alpha (Cube.exe and data1.db .. data4.db).
; Empty: look in the usual places (see src/Install.cpp).
Path=

[Window]
Width=1280
Height=720
VSync=1

[AntiAliasing]
; TAA (temporal, with sub-pixel jitter) then SMAA Ultra. Alpha itself only had multisampling.
TAA=1
SMAA=1
HistoryPercent=65
EdgeHistoryPercent=80
BlurPercent=12
JitterPercent=75

[Controller]
; Built-in gamepad support (Alpha itself reads only keyboard and mouse). Any pad with a
; standard Xbox-style mapping: left stick move, right stick camera, A jump, B dodge,
; RT/LT the two mouse attacks, X/Y/RB/LB ability keys 1-4, Start the Esc menu row, Back the
; world map, D-pad up/down camera zoom, D-pad right the quick item. On menus a stick moves
; the cursor, A clicks and B backs out; on the map the left stick pans and the triggers zoom.
Enabled=1
; Stick dead zone, percent of travel.
DeadZone=20
; Camera turn speed at full tilt, and the menu cursor's speed in pixels per second.
LookSpeed=300
CursorSpeed=900
InvertY=0

[Shadows]
; AlphaVulkan's own sun (and night-light) shadows. Alpha itself has none.
Enabled=1
Resolution=4096
Radius=120
StrengthPercent=90

[Moon]
; AlphaVulkan's moon (Alpha has none; 0 gives Alpha's black nights back).
Enabled=1
BrightnessPercent=30
ShadowStrengthPercent=60
NightAmbientPercent=30

[Mods]
; Mods to load, in order: compiled module IDs or folders under Mods/. Empty: none.
; Examples: Load=TimeLapse (DLL), Load=StoneTint (compiled terrain module).
Load=

[Motion]
; AlphaVulkan's cloud drift (Alpha's clouds stand still): back and forth up to
; CloudDriftDistance blocks (0-64) at CloudSpeedPercent (25-500).
Clouds=1
; Leaf sway on tree leaves (Alpha keeps them still): amplitude in hundredths of a block (0-25),
; full range in blocks (32-160), speed (10-200).
Leaves=1
LeafAmplitudePercent=12
LeafRange=96
WindSpeedPercent=100
CloudDriftDistance=32
CloudSpeedPercent=250

[Water]
; Omega: the Steam engine's shared refraction/reflection surface. Alpha: the native look.
Style=Omega
; Runtime extension: wet shallow surfaces become liquid, natural beds allow swimming,
; and reeds grow on dry banks. Use 0 only for native terrain comparisons/profiles.
Swimmable=1
